name: Hourly CPCB AQI Ingestion Pipeline

on:
  schedule:
    - cron: '0 * * * *'    # Runs every hour on the hour
  workflow_dispatch:        # Allows manual trigger via GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CPCB Data Ingestion & dbt Transformations
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          RESOURCE_ID: ${{ secrets.RESOURCE_ID }}
        run: |
          python run_pipeline.py

      - name: Commit & Push Updated DuckDB Database State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add airindex.duckdb
          git diff-index --quiet HEAD || git commit -m "auto: update hourly CPCB DuckDB snapshot [skip ci]"
          git push

